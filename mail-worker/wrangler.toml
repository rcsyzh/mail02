name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
workers_dev = false
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"
#database_name = ""
#database_id = ""

#[[kv_namespaces]]
#binding = "kv"
#id = ""

#[[r2_buckets]]
#binding = "r2"
#bucket_name = ""

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
